<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tactris — mobile header with logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#9bbc0f}
.c{box-sizing:border-box;aspect-ratio:1}
.f{background:#306230;border:calc(var(--s)*.14) solid #0f380f;box-shadow:inset calc(var(--s)*.12) calc(var(--s)*.12) 0 #8bac0f}
.g{border:calc(var(--s)*.12) dashed #0f380f;box-shadow:inset 0 0 0 calc(var(--s)*.12) #9bbc0f,inset 0 0 0 calc(var(--s)*.26) #306230}
.hbtn{font-family:'Silkscreen',monospace;font-size:12px;color:#9bbc0f;background:#0f380f;border:0;height:44px;padding:0 14px;cursor:pointer;box-shadow:3px 3px 0 #306230;display:inline-flex;align-items:center;justify-content:center}
.hbtn.alt{color:#0f380f;background:#8bac0f;box-shadow:3px 3px 0 #0f380f;width:44px;padding:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; color: #0f380f; background: repeating-linear-gradient(0deg, rgba(15,56,15,0.05) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(15,56,15,0.05) 0 1px, transparent 1px 4px), #9bbc0f">
  <header style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 3px solid #0f380f">
    <div role="img" aria-label="Tactris" style="display: grid; grid-template-columns: repeat(3, 12px); gap: 1px; --s: 12px">
      <sc-for list="{{icon}}" as="c" hint-placeholder-count="9"><div class="{{c.cls}}"></div></sc-for>
    </div>
    <nav style="display: flex; gap: 10px">
      <button class="hbtn">NEW GAME</button>
      <button class="hbtn alt" aria-label="Options"><svg width="18" height="18" viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="3" width="14" height="3" fill="currentColor"></rect><rect x="2" y="8" width="14" height="3" fill="currentColor"></rect><rect x="2" y="13" width="14" height="3" fill="currentColor"></rect></svg></button>
    </nav>
  </header>
  <main style="flex: 1"></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var map = { '.': 'c', 'f': 'c f', 'g': 'c g' };
    var icon = [];
    ['fff', '.f.', '.g.'].forEach(function (r) { r.split('').forEach(function (ch) { icon.push({ cls: map[ch] }); }); });
    return { icon: icon };
  }
}
</script>
</body>
</html>
