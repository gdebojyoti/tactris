<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 54 54" width="512" height="512" shape-rendering="crispEdges" role="img" aria-label="Tactris">
  <defs>
    <g id="tai-block">
      <rect width="12" height="12" fill="#9bbc0f"/>
      <rect x="2" y="2" width="8" height="8" fill="#8bac0f"/>
      <rect x="2" y="2" width="8" height="1" fill="#9bbc0f"/>
      <rect x="2" y="2" width="1" height="8" fill="#9bbc0f"/>
    </g>
    <g id="tai-ghost">
      <rect x="0.5" y="0.5" width="11" height="11" fill="none" stroke="#9bbc0f" stroke-width="1" stroke-dasharray="2 1"/>
      <rect x="3" y="3" width="6" height="6" fill="none" stroke="#8bac0f" stroke-width="2"/>
    </g>
  </defs>
  <rect x="-8" y="-8" width="54" height="54" fill="#0f380f"/>
